[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/router", "crates/settings"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dmbsk/broxer"

[workspace.dependencies]
broxer-core = { path = "crates/core" }
broxer-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
url = "2"
dirs = "6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
